<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Govt Polytechnic Kothagudem</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #dff6ff, #ffffff, #e8f5e9);
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 450px;
    background: white;
    padding: 30px 25px;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    color: #1261a0;
    font-size: 27px;
    margin-bottom: 8px;
}

.header p {
    color: #777;
    margin: 0;
}

.student-icon {
    width: 75px;
    height: 75px;
    margin: 15px auto;
    border-radius: 50%;
    background: #e3f2fd;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
    color: #333;
}

input, select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
}

input:focus, select:focus {
    border-color: #1261a0;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: #1261a0;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0b4778;
}

.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #999;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="student-icon">🎓</div>

        <h1>Govt Polytechnic Kothagudem</h1>

        <p>Student Information</p>

    </div>

    <form action="mummy(1).html" method="get">

        <label>Student Name</label>
        <input type="text" name="name" value="Sunny" required>

        <label>Place</label>
        <input type="text" name="place" value="Kothagudem" required>

        <label>Branch</label>
        <select name="branch">
            <option value="Civil">Civil Engineering</option>
            <option value ="mech">mech</option>
        </select>

        <label>Batch</label>
        <input type="text" name="batch" value="2022 - 2025" required>

        <label>PIN Number</label>
        <input type="text" name="pin" value="22046-CE-018" required>


        <button type="submit">
            Submit Details ✨
        </button>

    </form>

    <div class="photo">
       
    </div>

</div>

</body>
</html>
